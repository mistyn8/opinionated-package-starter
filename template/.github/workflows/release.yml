name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:

  build:
    runs-on: windows-latest

    env:
        PACKAGE_NAME: PackageStarter

    steps:

    - name: Validate tag is from main branch
      shell: bash
      run: |
          if [ "${{ github.event.base_ref }}" != "refs/heads/main" ]; then
            echo "❌ Error: Tags can only be created from the main branch"
            echo "This tag was created from: ${{ github.event.base_ref }}"
            exit 1
          fi
          echo "✅ Tag is from main branch"

    - name: Checkout repository
      uses: actions/checkout@v4
          
    - name: Set PACKAGE_JSON_PATH
      id: set_path
      shell: bash
      run: |
        echo "PACKAGE_JSON_PATH=src/$PACKAGE_NAME/wwwroot/App_Plugins/$PACKAGE_NAME/umbraco-package.json" >> $GITHUB_ENV

    - name: Update umbraco-package.json version
      shell: bash
      # update the version to match the tag
      run: |
        sed -i 's/"version": *"[^"]*"/"version": "${{github.ref_name}}"/' "$PACKAGE_JSON_PATH"

    - name: Verify umbraco-package.json version matches tag
      shell: bash
      run: |
        actual_version=$(grep '"version":' ""$PACKAGE_JSON_PATH"" | sed 's/.*"version": *"\([^"]*\)".*/\1/')
        expected_version="${{github.ref_name}}"

        echo "Checking version in: $PACKAGE_JSON_PATH"
        echo "Expected version: $expected_version"
        echo "Actual version:   $actual_version"

        if [ "$actual_version" != "$expected_version" ]; then
          echo "❌ Version mismatch!"
          exit 1
        else
          echo "✅ Version matches."
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        # cache: 'npm' # caching is disabled for now

    - name: Display Node and npm versions
      run: |
        node --version
        npm --version

    - name: Install npm dependencies
      run: npm install

    - name: Build frontend assets with Vite
      env:
        VITE_VERSION: ${{ github.ref_name }}
      run: npm run build

    - name: Display installed SDKs
      run: dotnet --list-sdks

    - name: Check for any .NET 10.0 SDK
      shell: pwsh
      run: |
        $sdkPrefix = "10.0"
        $installed = dotnet --list-sdks | Where-Object { $_ -like "$sdkPrefix*" }
        if (-not $installed) {
          Write-Host ".NET SDK $sdkPrefix not found. Will install latest 10.0.x."
          echo "INSTALL_DOTNET=1" >> $env:GITHUB_ENV
        } else {
          Write-Host "Found .NET SDK(s):"
          $installed | ForEach-Object { Write-Host $_ }
        }

    - name: Setup .NET SDK 10.0.x (if missing)
      if: env.INSTALL_DOTNET == '1'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build & Pack
      run: |
        echo "Packing project: src/${{ env.PACKAGE_NAME }}/${{ env.PACKAGE_NAME }}.csproj"
        dotnet pack src/${{ env.PACKAGE_NAME }}/${{ env.PACKAGE_NAME }}.csproj -c Release /p:Version=${{github.ref_name}}

    - name: Publish to NuGet
      working-directory: src/${{ env.PACKAGE_NAME }}/bin/Release
      run: |
        dotnet nuget push *.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate